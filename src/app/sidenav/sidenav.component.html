
@let sidenavRole = isHandset() ? 'dialog' : 'navigation';
@let sidenavMode = isHandset() ? 'over' : 'side';

@if (!isHandset()) {
  <app-toolbar (menuClick)="sidenav.toggle()" />
}

<mat-sidenav-container>
  <mat-sidenav #sidenav [fixedInViewport]="isHandset()" [attr.role]="sidenavRole" [mode]="sidenavMode" [opened]="isHandset() === false">
    <mat-nav-list>
      @if (isHandset()) {
        <mat-toolbar>Menu</mat-toolbar>
      }
          
      <a mat-list-item href="#">Link 1</a>
      <a mat-list-item href="#">Link 2</a>
      <a mat-list-item href="#">Link 3</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (isHandset()) {
      <app-toolbar (menuClick)="sidenav.toggle()" />
    }

    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
