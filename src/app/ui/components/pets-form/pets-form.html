<mat-card>
  <mat-card-title>{{ data ? 'Edit Pet' : 'Add New Pet' }}</mat-card-title>

  <form [formGroup]="form" (ngSubmit)="saveCommand.execute()">
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Breed</mat-label>
        <input matInput formControlName="breed" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Age</mat-label>
        <input matInput type="number" formControlName="age" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="male">Male</mat-option>
          <mat-option value="female">Female</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-checkbox formControlName="isAdoped">Already Adopted</mat-checkbox>

      <div>
        <button matFab extended type="button" (click)="files.click()">
          <mat-icon>add</mat-icon>
          Choose files
        </button>
        <input #files [style]="{'display': 'none'}" type="file" multiple (change)="onImageSelected($event)" accept="image/*" />
      </div>

      @if (previewImages().length > 0) {
        <mat-grid-list cols="1">
          @for (img of previewImages(); track img; let i = $index) {
            <mat-grid-tile>
              <img [src]="img" alt="Preview" mat-card-image />
              <button mat-icon-button color="warn" type="button" (click)="removeImage(i)" aria-label="Remove image">
                <mat-icon>close</mat-icon>
              </button>
            </mat-grid-tile>
          }
        </mat-grid-list>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
        @if (!this.saveCommand.running()) {
          Save
        } @else {
          <mat-spinner [diameter]="30" />
        }
      </button>
    </mat-card-actions>
  </form>
</mat-card>
