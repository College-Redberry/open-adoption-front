<mat-form-field appearance="outline">
  <mat-label>Nome</mat-label>
  <input matInput [(ngModel)]="name" placeholder="Type pet name" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Tipo</mat-label>
  <input matInput [(ngModel)]="breed" placeholder="Type breed" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Idade</mat-label>
  <input matInput [(ngModel)]="age" placeholder="Type age" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Gênero</mat-label>
  <mat-select [(ngModel)]="gender">
    <mat-option value="">Todos</mat-option>
    <mat-option value="male">Masculino</mat-option>
    <mat-option value="female">Feminino</mat-option>
  </mat-select>
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Adotado</mat-label>
  <mat-select [(ngModel)]="isAdopted">
    <mat-option [value]="null">Todos</mat-option>
    <mat-option [value]="true">Sim</mat-option>
    <mat-option [value]="false">Não</mat-option>
  </mat-select>
</mat-form-field>
