<h2 mat-dialog-title>{{ data.title || "Confirm" }}</h2>

@if (data.content) {
    <mat-dialog-content class="mat-typography">
        {{ data.content }}
    </mat-dialog-content>
}

<mat-dialog-actions align="end">
    @if (!data.hideCancel) {
        <button matButton mat-dialog-close cdkFocusInitial>{{ data.cancelLabel || "cancelar" }}</button>
    }

    @if (!data.hideConfirm) {
        <button matButton [mat-dialog-close]="true">{{ data.confirmLabel || "aceitar"}}</button>
    }
</mat-dialog-actions>
