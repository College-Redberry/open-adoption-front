<app-search-pet #search/>
<div class="pets">
    <section>
        @for (pet of search.pets(); track pet.id; let isLast = $last) {
            @let image = pet.images?.at(0);
            @if (image) {
                <div class="item" (cdkObserveContent)="isLast && search.loadNextPage()">
                    <img [src]="image" alt="">
                </div>
            }
        }
    </section>
</div>
